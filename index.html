<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Forum2all - Live Montagsmaler</title>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 100%; margin: 0 auto; display: flex; gap: 20px; padding: 10px; box-sizing: border-box; }
        .game-area { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        #canvas { border: 2px solid #2c3e50; cursor: crosshair; background: #fff; display: block; margin-bottom: 10px; touch-action: none; }
        .tools button { padding: 6px 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .tools button:hover { background: #2980b9; }

        .chat-box { height: 250px; border: 1px solid #ddd; border-radius: 4px; display: flex; flex-direction: column; background: #fafafa; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; font-size: 13px; }
        #messages li { margin-bottom: 6px; }
        .chat-input-area { display: flex; border-top: 1px solid #ddd; }
        #chat-input { flex: 1; padding: 8px; border: none; outline: none; font-size: 13px; }
        .chat-input-area button { padding: 8px 12px; background: #2ecc71; color: white; border: none; cursor: pointer; }

        #word-display { font-size: 18px; font-weight: bold; color: #e74c3c; margin-bottom: 10px; }
        .score-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
        .score-list li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Zeichnen & Spielbereich -->
        <div class="game-area">
            <h2>🎨 Live-Montagsmaler</h2>
            <div id="word-display">Warte auf Mitspieler...</div>
            
            <canvas id="canvas" width="560" height="400"></canvas>
            
            <div class="tools" id="drawing-tools" style="display: none;">
                <button onclick="setColor('black')">Schwarz</button>
                <button onclick="setColor('red')">Rot</button>
                <button onclick="setColor('blue')">Blau</button>
                <button onclick="clearCanvas()">Löschen</button>
            </div>
        </div>

        <!-- Sidebar: Highscores & Chat -->
        <div class="sidebar">
            <div class="card">
                <h3>🏆 Live-Punkte</h3>
                <ul id="score-list" class="score-list">
                    <li>Lade Bestenliste...</li>
                </ul>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <div style="padding: 10px 15px; background: #2c3e50; color: white; font-weight: bold; font-size: 14px;">Chat & Raten</div>
                <div class="chat-box">
                    <ul id="messages"></ul>
                    <form class="chat-input-area" onsubmit="sendChat(event)">
                        <input id="chat-input" autocomplete="off" placeholder="Begriff hier raten..." />
                        <button type="submit">Senden</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Benutzername aus der URL holen (wird später vom Forum übergeben, z.B. maler.html?user=Raab)
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'Gast_' + Math.floor(Math.random() * 1000);

        // Beim Server anmelden
        socket.emit('set-username', username);

        // Canvas Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = 'black';
        let isMyTurn = false;

        canvas.addEventListener('mousedown', (e) => { if (isMyTurn) { painting = true; draw(e); } });
        canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', (e) => { if (painting && isMyTurn) draw(e); });

        function draw(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Koordinaten an den Server senden
            socket.emit('draw', { x, y, color: currentColor });
        }

        // Zeichnungen von anderen Spielern empfangen
        socket.on('draw', (data) => {
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = data.color;
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(data.x, data.y);
        });

        socket.on('clear', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            socket.emit('clear');
        }

        function setColor(color) {
            currentColor = color;
        }

        // Runden-Steuerung: Wer ist dran?
        socket.on('new-round', (data) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (data.drawerId === socket.id) {
                isMyTurn = true;
                document.getElementById('drawing-tools').style.display = 'block';
            } else {
                isMyTurn = false;
                document.getElementById('drawing-tools').style.display = 'none';
                document.getElementById('word-display').innerText = "Rate den Begriff im Chat!";
            }
        });

        // Wenn ich der Maler bin, bekomme ich das geheime Wort
        socket.on('your-word', (word) => {
            document.getElementById('word-display').innerText = `Du musst malen: ${word.toUpperCase()}`;
        });

        // Chat-Nachrichten senden & empfangen
        function sendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if (input.value.trim() !== "") {
                socket.emit('chat-message', { message: input.value });
                input.value = '';
            }
        }

        socket.on('chat-message', (data) => {
            const messages = document.getElementById('messages');
            const li = document.createElement('li');
            li.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        });

        // Live-Punktestand aktualisieren
        socket.on('update-scores', (scores) => {
            const scoreList = document.getElementById('score-list');
            scoreList.innerHTML = '';
            for (let id in scores) {
                const li = document.createElement('li');
                li.innerHTML = `<span>${scores[id].username}</span> <strong>${scores[id].points} Pkt</strong>`;
                scoreList.appendChild(li);
            }
        });
    </script>
</body>
</html>
